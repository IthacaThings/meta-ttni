# PR service floors so rebuilt packages continue numbering from what
# ttni.tech already publishes instead of restarting at .0.
#
# Each value is one below the published suffix: an unchanged rebuild
# gets the same version as the feed (no needless opkg upgrade) and any
# later change sorts above it.  The checksum field is a placeholder
# that no real task signature matches.
#
# Import with:
#   bitbake -R conf/primport.conf -R ../layers/meta-ttni/conf/prserv-floor.conf -p

# ttni.tech/mlinux/feeds/5.3.31 (2022-03-27): mt-dt-overlay .7, preserve .3
PRAUTO$mt-dt-overlay-1.1.2-r4$mtcdt$ttni.tech-5.3.31 = "6"
PRAUTO$mt-dt-overlay-1.1.2-r4$mtcap$ttni.tech-5.3.31 = "6"
PRAUTO$preserve-1.0-r1$arm926ejste$ttni.tech-5.3.31 = "2"
